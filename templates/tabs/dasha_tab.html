<div style="margin-top: 10px; margin-bottom: 40px;">
    <div style="background: #ffffff; border: 1px solid #a5d6a7; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; min-width: 300px;">
            <thead><tr style="background: #c62828; color: white;"><th style="padding: 10px; border: 1px solid #ddd;">महादशा</th><th style="padding: 10px; border: 1px solid #ddd;">आरंभ</th><th style="padding: 10px; border: 1px solid #ddd;">समाप्ति</th></tr></thead>
            <tbody>
                {% for d in res.dasha %}
                <tr style="background: {% if d.is_current %}#e8f5e9{% elif forloop.counter|divisibleby:2 %}#f9f9f9{% else %}#ffffff{% endif %}; border: {% if d.is_current %}2px solid #2e7d32{% else %}none{% endif %};">
                    <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">
                        <div style="font-weight: bold; color: {% if d.is_current %}#2e7d32{% else %}#d35400{% endif %};">{{ d.planet }}{% if d.is_current %}<br><span style="background: #2e7d32; color: white; font-size: 10px; padding: 2px 5px; border-radius: 4px; display:inline-block; margin-top:3px;">वर्तमान</span>{% endif %}</div>
                        <button onclick="toggleAntardasha({{ forloop.counter }})" id="btn-md-{{ forloop.counter }}" style="background: #fdf2e9; border: 1px solid #e59866; border-radius: 4px; font-size: 11px; padding: 2px 6px; color: #c0392b; margin-top: 5px; cursor: pointer;">{% if d.is_current %}➖{% else %}➕{% endif %}</button>
                    </td>
                    <td style="padding: 10px; border: 1px solid #ddd; font-family: monospace; font-size: 13px; color: #2c3e50;">{{ d.start }}</td>
                    <td style="padding: 10px; border: 1px solid #ddd; font-family: monospace; font-size: 13px; color: #2c3e50;">{{ d.end }}</td>
                </tr>
                <tr id="ad-row-{{ forloop.counter }}" style="display: {% if d.is_current %}table-row{% else %}none{% endif %}; background: #2c3e50;">
                    <td colspan="3" style="padding: 0;">
                        <table style="width: 100%; font-size: 13px; color: white; border-collapse: collapse;">
                            <tr style="background: #1a252f; text-align: left;"><th style="padding: 8px 10px 8px 40px; color: #bdc3c7;">अंतर्दशा</th><th style="padding: 8px 10px; color: #bdc3c7;">आरंभ</th><th style="padding: 8px 10px; color: #bdc3c7;">समाप्ति</th></tr>
                            {% for ad in d.antardashas %}
                            <tr style="border-bottom: 1px solid #34495e; background: {% if ad.is_current %}#1e8449{% else %}transparent{% endif %};">
                                <td style="padding: 6px 10px 6px 40px; color: {% if ad.is_current %}#ffffff{% else %}#f1c40f{% endif %};">{{ ad.planet }}</td>
                                <td style="padding: 6px 10px; color: #ecf0f1;">{{ ad.start }}</td><td style="padding: 6px 10px; color: #ecf0f1;">{{ ad.end }}</td>
                            </tr>
                            {% endfor %}
                        </table>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<script>
    function toggleAntardasha(id) {
        var row = document.getElementById('ad-row-' + id);
        var btn = document.getElementById('btn-md-' + id);
        
        if (row.style.display === 'none' || row.style.display === '') {
            row.style.display = 'table-row';
            btn.innerHTML = '➖'; // खुलने पर माइनस का निशान
        } else {
            row.style.display = 'none';
            btn.innerHTML = '➕'; // बंद होने पर वापस प्लस का निशान
        }
    }
</script>
