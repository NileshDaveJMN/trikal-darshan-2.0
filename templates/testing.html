<style>
    .milan-container { background: #1a1a1a; color: #ffffff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 20px; }
    .card-milan { background: #262626; border: 1px solid #3d3d3d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section-title { color: #f39c12; border-bottom: 2px solid #f39c12; padding-bottom: 5px; margin-bottom: 20px; font-weight: bold; }
    .btn-milan { background: linear-gradient(135deg, #f39c12, #e67e22); border: none; color: white; padding: 12px 30px; font-size: 18px; border-radius: 50px; width: 100%; font-weight: bold; transition: 0.3s; cursor: pointer; }
    .btn-milan:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4); }
    .result-box { display: none; margin-top: 30px; animation: fadeIn 0.8s; }
    .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid #f39c12; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 20px; background: #333; }
    .remedy-card { background: #2c3e50; border-left: 5px solid #e74c3c; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="container milan-container mb-5">
    <h2 class="text-center mb-4 text-warning">💑 अष्टकूट कुंडली मिलान</h2>
    
    <form id="milanForm">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6">
                <div class="card-milan">
                    <h4 class="section-title">🤵 वर का विवरण (Boy)</h4>
                    <input type="text" name="boy_name" class="form-control bg-dark text-white border-secondary mb-3" placeholder="वर का नाम" required>
                    <select name="boy_nakshatra" class="form-select bg-dark text-white border-secondary mb-3" required>
                        <option value="">नक्षत्र चुनें</option>
                        <option value="Ashwini">अश्विनी</option><option value="Bharani">भरणी</option><option value="Krittika">कृत्तिका</option>
                        <option value="Rohini">रोहिणी</option><option value="Mrigashira">मृगशिरा</option><option value="Ardra">आर्द्रा</option>
                        <option value="Punarvasu">पुनर्वसु</option><option value="Pushya">पुष्य</option><option value="Ashlesha">अश्लेषा</option>
                        <option value="Magha">मघा</option><option value="Purva Phalguni">पूर्वाफाल्गुनी</option><option value="Uttara Phalguni">उत्तराफाल्गुनी</option>
                        <option value="Hasta">हस्त</option><option value="Chitra">चित्रा</option><option value="Swati">स्वाति</option>
                        <option value="Vishakha">विशाखा</option><option value="Anuradha">अनुराधा</option><option value="Jyeshtha">ज्येष्ठा</option>
                        <option value="Mula">मूल</option><option value="Purva Ashadha">पूर्वाषाढ़ा</option><option value="Uttara Ashadha">उत्तराषाढ़ा</option>
                        <option value="Shravana">श्रवण</option><option value="Dhanishta">धनिष्ठा</option><option value="Shatabhisha">शतभिषा</option>
                        <option value="Purva Bhadrapada">पूर्वाभाद्रपद</option><option value="Uttara Bhadrapada">उत्तराभाद्रपद</option><option value="Revati">रेवती</option>
                    </select>
                    <select name="boy_rashi" class="form-select bg-dark text-white border-secondary mb-3">
                        <option value="मेष">मेष</option><option value="वृषभ">वृषभ</option><option value="मिथुन">मिथुन</option>
                        <option value="कर्क">कर्क</option><option value="सिंह">सिंह</option><option value="कन्या">कन्या</option>
                        <option value="तुला">तुला</option><option value="वृश्चिक">वृश्चिक</option><option value="धनु">धनु</option>
                        <option value="मकर">मकर</option><option value="कुंभ">कुंभ</option><option value="मीन">मीन</option>
                    </select>
                    <div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="boy_manglik" value="yes" id="boyManglik"><label class="form-check-label" for="boyManglik">मांगलिक?</label></div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card-milan">
                    <h4 class="section-title">👰 कन्या का विवरण (Girl)</h4>
                    <input type="text" name="girl_name" class="form-control bg-dark text-white border-secondary mb-3" placeholder="कन्या का नाम" required>
                    <select name="girl_nakshatra" class="form-select bg-dark text-white border-secondary mb-3" required>
                        <option value="">नक्षत्र चुनें</option>
                        </select>
                    <select name="girl_rashi" class="form-select bg-dark text-white border-secondary mb-3">
                        </select>
                    <div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="girl_manglik" value="yes" id="girlManglik"><label class="form-check-label" for="girlManglik">मांगलिक?</label></div>
                </div>
            </div>
        </div>
        <button type="submit" class="btn-milan shadow-lg">💖 मिलान चेक करें</button>
    </form>

    <div id="resultArea" class="result-box mt-5">
        <hr class="border-secondary mb-5">
        <div class="text-center mb-4">
            <div class="score-circle"><span id="finalScore">0</span>/36</div>
            <h3 id="matchStatus"></h3>
            <p id="manglikNote" class="badge bg-secondary p-2 fs-6 mt-2"></p>
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-hover border-secondary">
                <thead><tr class="text-warning"><th>कूट</th><th>प्राप्त अंक</th><th>स्थिति</th></tr></thead>
                <tbody id="breakdownTable"></tbody>
            </table>
        </div>
        <div id="pdf-download-container"></div>
        <div id="remedyArea" class="mt-4 text-start"></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$('#milanForm').on('submit', function(e) {
    e.preventDefault();
    $('#resultArea').fadeIn();
    $('html, body').animate({ scrollTop: $("#resultArea").offset().top - 50 }, 600);

    $.ajax({
        url: "{% url 'api_calculate_milan' %}",
        method: "POST",
        data: $(this).serialize(),
        success: function(response) {
            if(response.status == 'success') {
                let d = response.data;
                $('#finalScore').text(d.total_score);
                $('#matchStatus').text(d.is_recommended ? "✅ शुभ मिलान" : "⚠️ सामान्य मिलान");
                $('#matchStatus').css('color', d.is_recommended ? '#2ecc71' : '#f1c40f');
                
                let tableHtml = "";
                for (let koot in d.breakdown) {
                    let item = d.breakdown[koot];
                    tableHtml += `<tr><td>${koot}</td><td>${item.score}/${item.max}</td><td>${item.status}</td></tr>`;
                }
                $('#breakdownTable').html(tableHtml);
                $('#manglikNote').text(d.manglik_status);
            }
        }
    });
});
</script>
