{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: #131c2c; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); border: 1px solid #334155;">
    <h2 style="color: #ffffff; text-align: center; margin-bottom: 20px;">📝 नया अकाउंट बनाएं</h2>
    
    {% if messages %}
        {% for m in messages %}
        <div style="background: rgba(255, 71, 87, 0.1); border: 1px solid #ff4757; color: #ff4757; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center;">
            {{ m }}
        </div>
        {% endfor %}
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="यूज़रनेम (बिना स्पेस के)" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; color: #ffffff; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; outline: none;">
        
        <input type="email" name="email" placeholder="ईमेल पता" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; color: #ffffff; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; outline: none;">
        
        <input type="password" name="password" placeholder="नया पासवर्ड" required style="width: 100%; padding: 12px; margin-bottom: 25px; background: #0f172a; color: #ffffff; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; outline: none;">
        
        <button type="submit" style="width: 100%; background: #ffca28; color: #0f172a; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(255, 202, 40, 0.4); text-transform: uppercase;">रजिस्टर करें ➔</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #cbd5e1; font-size: 14px;">पहले से अकाउंट है? <a href="{% url 'login' %}" style="color: #24a1de; font-weight: bold; text-decoration: none;">लॉगिन करें</a></p>
</div>
{% endblock %}
