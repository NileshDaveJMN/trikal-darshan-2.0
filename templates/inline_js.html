<script>
// ==========================================
// 1. मेन टैब (प्रोफाइल, कुंडली, मिलान) बदलने का कोड
// ==========================================
function showView(event, viewId) {
    // सभी पैनल छुपाएं
    var panels = document.querySelectorAll('.view-panel');
    panels.forEach(function(panel) {
        panel.classList.remove('active');
        panel.style.display = 'none';
    });
    
    // सभी टैब बटन से एक्टिव क्लास हटाएं
    var tabs = document.querySelectorAll('.p-tab-btn');
    tabs.forEach(function(tab) {
        tab.classList.remove('active');
    });
    
    // जो पैनल चुना है उसे दिखाएं
    var selectedPanel = document.getElementById(viewId);
    if (selectedPanel) {
        selectedPanel.classList.add('active');
        selectedPanel.style.display = 'block';
    }
    
    // बटन को एक्टिव दिखाएं
    if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }
    // सब-टैब बार (लग्न, दशा) को सिर्फ कुंडली पर दिखाएं
    var subTabsBar = document.getElementById('sub-tabs-bar');
    if (subTabsBar) {
        var kundaliResult = document.getElementById('kundali-result-section');
        if (viewId === 'view-kundali' && kundaliResult && kundaliResult.style.display !== 'none') {
            subTabsBar.style.display = 'flex';
        } else {
            subTabsBar.style.display = 'none';
        }
    }
}

// ==========================================
// 2. कुंडली के अंदर वाले सब-टैब बदलने का कोड
// ==========================================
function switchSubTab(element, panelId) {
    var panels = document.querySelectorAll('.sub-panel');
    panels.forEach(function(panel) {
        panel.classList.remove('active');
        panel.style.display = 'none';
    });
    
    var tabs = document.querySelectorAll('.sub-tab');
    tabs.forEach(function(tab) {
        tab.classList.remove('active');
    });
    
    var selectedPanel = document.getElementById(panelId);
    if (selectedPanel) {
        selectedPanel.classList.add('active');
        selectedPanel.style.display = 'block';
    }
    
    if (element) {
        element.classList.add('active');
    }
}

// ==========================================
// 3. कुंडली PDF का चार्ट डाउनलोड करने का कोड
// ==========================================
function captureChartAndDownload() {
    var chartElement = document.getElementById('kundali_chart_div');
    var chartPanel = document.getElementById('panel-lagna');

    if (!chartElement) {
        document.getElementById('pdfDownloadForm').submit();
        return;
    }

    var panelWasHidden = chartPanel && chartPanel.style.display === 'none';
    if (panelWasHidden) {
        chartPanel.style.display = 'block';
        chartPanel.style.visibility = 'hidden';
    }

    setTimeout(function() {
        html2canvas(chartElement, {
            scale: 2,
            backgroundColor: "#ffffff",
            useCORS: true,
            logging: false
        }).then(function(canvas) {
            if (panelWasHidden) {
                chartPanel.style.display = 'none';
                chartPanel.style.visibility = '';
            }
            var imgData = canvas.toDataURL("image/png");
            document.getElementById('chart_image_data').value = imgData;
            document.getElementById('pdfDownloadForm').submit();
        }).catch(function(err) {
            console.error("Chart capture error: ", err);
            if (panelWasHidden) {
                chartPanel.style.display = 'none';
                chartPanel.style.visibility = '';
            }
            document.getElementById('pdfDownloadForm').submit();
        });
    }, 600);
}

// ==========================================
// 4. जन्म स्थान Autocomplete (Nominatim)
// ==========================================
(function() {
    var debounceTimer = null;

    function fetchCities(query) {
        if (query.length < 2) {
            document.getElementById('city_suggestions').innerHTML = '';
            return;
        }

        fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&q=' + encodeURIComponent(query), {
            headers: {
                'Accept-Language': 'hi,en'
            }
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var box = document.getElementById('city_suggestions');
            box.innerHTML = '';

            if (!data || data.length === 0) {
                box.innerHTML = '<div style="padding:10px; color:#aab4be; font-size:13px;">कोई शहर नहीं मिला</div>';
                return;
            }

            data.forEach(function(item) {
                var div = document.createElement('div');
                div.className = 'city-suggestion-item';
                div.textContent = item.display_name;
                div.addEventListener('click', function() {
                    document.getElementById('city_input').value = item.display_name;
                    document.getElementById('lat_input').value = item.lat;
                    document.getElementById('lon_input').value = item.lon;
                    document.getElementById('city_suggestions').innerHTML = '';
                    document.getElementById('city_status').innerHTML = '<span style="color:#4caf50; font-size:13px;">✓ शहर चुना गया</span>';
                });
                box.appendChild(div);
            });
        })
        .catch(function() {
            document.getElementById('city_suggestions').innerHTML = '<div style="padding:10px; color:#ff4757; font-size:13px;">नेटवर्क त्रुटि, पुनः प्रयास करें</div>';
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        var input = document.getElementById('city_input');
        if (!input) return;

        input.addEventListener('input', function() {
            document.getElementById('lat_input').value = '';
            document.getElementById('lon_input').value = '';
            document.getElementById('city_status').innerHTML = '';

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function() {
                fetchCities(input.value.trim());
            }, 400);
        });

        // Bahar click karne par suggestions band karo
        document.addEventListener('click', function(e) {
            var box = document.getElementById('city_suggestions');
            var input = document.getElementById('city_input');
            if (box && e.target !== input && !box.contains(e.target)) {
                box.innerHTML = '';
            }
        });
    });
})();
</script>

<script>
// ==========================================
// PUSH NOTIFICATIONS
// ==========================================
var PUSH_VAPID_KEY = '';

function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = window.atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
}

function getCsrf() {
    var cookies = document.cookie.split(';');
    for (var i = 0; i < cookies.length; i++) {
        var c = cookies[i].trim();
        if (c.startsWith('csrftoken=')) return c.split('=')[1];
    }
    return '';
}

function showPushToast(msg) {
    var toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:12px 20px;border-radius:20px;font-size:14px;z-index:9999;border:1px solid #ffca28;box-shadow:0 4px 15px rgba(0,0,0,0.4);';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 3500);
}

function updatePushBtn(isSubscribed) {
    var btn = document.getElementById('push-toggle-btn');
    if (!btn) return;
    if (isSubscribed) {
        btn.textContent = '🔕 सूचनाएं बंद करें';
        btn.style.background = '#334155';
        btn.onclick = doUnsubscribe;
    } else {
        btn.textContent = '🔔 दैनिक सूचनाएं पाएं';
        btn.style.background = 'linear-gradient(45deg,#b71c1c,#e53935)';
        btn.onclick = doSubscribe;
    }
}

function doSubscribe() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        showPushToast('❌ आपका browser push notifications support नहीं करता');
        return;
    }
    fetch('/api/push/vapid-key/')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            PUSH_VAPID_KEY = data.publicKey;
            return navigator.serviceWorker.register('/static/sw.js');
        })
        .then(function(reg) {
            return reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUSH_VAPID_KEY)
            });
        })
        .then(function(subscription) {
            return fetch('/api/push/subscribe/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrf()
                },
                body: JSON.stringify(subscription)
            });
        })
        .then(function(r) {
            if (r.ok) {
                showPushToast('🔔 सूचनाएं चालू हो गईं!');
                updatePushBtn(true);
            }
        })
        .catch(function(err) {
            console.error('Push subscribe error:', err);
            if (err.name === 'NotAllowedError') {
                showPushToast('⚠️ Permission denied। Browser settings से allow करें।');
            } else {
                showPushToast('❌ Error: ' + err.message);
            }
        });
}

function doUnsubscribe() {
    navigator.serviceWorker.register('/static/sw.js')

        .then(function(reg) { return reg.pushManager.getSubscription(); })
        .then(function(sub) {
            if (sub) {
                fetch('/api/push/unsubscribe/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
                    body: JSON.stringify({ endpoint: sub.endpoint })
                });
                return sub.unsubscribe();
            }
        })
        .then(function() {
            showPushToast('🔕 सूचनाएं बंद कर दी गईं।');
            updatePushBtn(false);
        });
}

function initPushButton() {
    var btn = document.getElementById('push-toggle-btn');
    if (!btn) return;

    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        btn.style.display = 'none';
        return;
    }

    navigator.serviceWorker.register('/static/sw.js').then(function(reg) {
        reg.pushManager.getSubscription().then(function(sub) {
            updatePushBtn(!!sub);
        });
    });

    // btn.onclick = doSubscribe; <--- इस लाइन को हटा दें
}

// Profile tab khulne par init karo
var _origShowView = typeof showView === 'function' ? showView : null;
showView = function(event, viewId) {
    if (_origShowView) _origShowView(event, viewId);
    if (viewId === 'view-user') {
        setTimeout(initPushButton, 100);
    }
};
// ==========================================
// दैनिक राशिफल प्राप्त करने का AJAX कोड
// ==========================================
function fetchRashifal(rashiId, rashiName) {
    // UI रिसेट करें
    document.getElementById('rashifal-result').style.display = 'none';
    document.getElementById('rashifal-error').style.display = 'none';
    document.getElementById('rashifal-loading').style.display = 'block';

    // API कॉल (बिना पेज रीलोड किए)
    fetch(`/api/rashifal/?rashi_id=${rashiId}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('rashifal-loading').style.display = 'none';
            
            if (data.success) {
                // डेटा भरें
                document.getElementById('res-title').innerText = "✨ " + rashiName + " राशिफल ✨";
                document.getElementById('res-general').innerText = data.GENERAL || 'विवरण उपलब्ध नहीं';
                document.getElementById('res-career').innerText = data.CAREER || 'विवरण उपलब्ध नहीं';
                document.getElementById('res-love').innerText = data.LOVE || 'विवरण उपलब्ध नहीं';
                document.getElementById('res-health').innerText = data.HEALTH || 'विवरण उपलब्ध नहीं';
                document.getElementById('res-lucky').innerText = data.LUCKY || 'विवरण उपलब्ध नहीं';
                document.getElementById('res-upay').innerText = data.UPAY || 'विवरण उपलब्ध नहीं';
                
                // रिजल्ट दिखाएं
                document.getElementById('rashifal-result').style.display = 'block';
            } else {
                // एरर दिखाएं
                document.getElementById('rashifal-error').innerText = data.error || "सर्वर से उत्तर प्राप्त नहीं हुआ।";
                document.getElementById('rashifal-error').style.display = 'block';
            }
        })
        .catch(error => {
            document.getElementById('rashifal-loading').style.display = 'none';
            document.getElementById('rashifal-error').innerText = "नेटवर्क की समस्या या सर्वर से संपर्क नहीं हो पाया।";
            document.getElementById('rashifal-error').style.display = 'block';
            console.error("Rashifal Error:", error);
        });
}

// Page load par bhi try karo
document.addEventListener('DOMContentLoaded', function() {
    initPushButton();
});
</script>
