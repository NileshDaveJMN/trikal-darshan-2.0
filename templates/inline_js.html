<script>
// ==========================================
// 1. मेन टैब (प्रोफाइल, कुंडली, मिलान) बदलने का कोड
// ==========================================
function showView(event, viewId) {
    // सभी पैनल छुपाएं
    var panels = document.querySelectorAll('.view-panel');
    panels.forEach(function(panel) {
        panel.classList.remove('active');
        panel.style.display = 'none';
    });
    
    // सभी टैब बटन से एक्टिव क्लास हटाएं
    var tabs = document.querySelectorAll('.p-tab-btn');
    tabs.forEach(function(tab) {
        tab.classList.remove('active');
    });
    
    // जो पैनल चुना है उसे दिखाएं
    var selectedPanel = document.getElementById(viewId);
    if (selectedPanel) {
        selectedPanel.classList.add('active');
        selectedPanel.style.display = 'block';
    }
    
    // बटन को एक्टिव दिखाएं
    if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }

    // सब-टैब बार (लग्न, दशा) को सिर्फ कुंडली पर दिखाएं
    var subTabsBar = document.getElementById('sub-tabs-bar');
    if (subTabsBar) {
        var kundaliResult = document.getElementById('kundali-result-section');
        if (viewId === 'view-kundali' && kundaliResult && kundaliResult.style.display !== 'none') {
            subTabsBar.style.display = 'flex';
        } else {
            subTabsBar.style.display = 'none';
        }
    }
}

// ==========================================
// 2. कुंडली के अंदर वाले सब-टैब बदलने का कोड
// ==========================================
function switchSubTab(element, panelId) {
    var panels = document.querySelectorAll('.sub-panel');
    panels.forEach(function(panel) {
        panel.classList.remove('active');
        panel.style.display = 'none';
    });
    
    var tabs = document.querySelectorAll('.sub-tab');
    tabs.forEach(function(tab) {
        tab.classList.remove('active');
    });
    
    var selectedPanel = document.getElementById(panelId);
    if (selectedPanel) {
        selectedPanel.classList.add('active');
        selectedPanel.style.display = 'block';
    }
    
    if (element) {
        element.classList.add('active');
    }
}

// ==========================================
// 3. कुंडली PDF का चार्ट डाउनलोड करने का कोड
// ==========================================
function captureChartAndDownload() {
    // Chart element dhundo — kisi bhi tab se PDF kaam kare
    var chartElement = document.getElementById('kundali_chart_div');
    var chartPanel = document.getElementById('panel-lagna');

    if (!chartElement) {
        // Chart nahi mila — bina image ke PDF bhejo
        document.getElementById('pdfDownloadForm').submit();
        return;
    }

    // Chart panel temporarily visible karo capture ke liye
    var panelWasHidden = chartPanel && chartPanel.style.display === 'none';
    if (panelWasHidden) {
        chartPanel.style.display = 'block';
        chartPanel.style.visibility = 'hidden'; // Visible but not shown
    }

    setTimeout(function() {
        html2canvas(chartElement, {
            scale: 2,
            backgroundColor: "#ffffff",
            useCORS: true,
            logging: false
        }).then(function(canvas) {
            // Restore panel state
            if (panelWasHidden) {
                chartPanel.style.display = 'none';
                chartPanel.style.visibility = '';
            }
            var imgData = canvas.toDataURL("image/png");
            document.getElementById('chart_image_data').value = imgData;
            document.getElementById('pdfDownloadForm').submit();
        }).catch(function(err) {
            console.error("Chart capture error: ", err);
            if (panelWasHidden) {
                chartPanel.style.display = 'none';
                chartPanel.style.visibility = '';
            }
            document.getElementById('pdfDownloadForm').submit();
        });
    }, 600);
}
</script>
